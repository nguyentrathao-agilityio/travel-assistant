name: Evalite — Run Evals & Deploy Report
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      run_real_llm:
        description: 'Use real OpenAI instead of AIMock'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evalite-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # 1. Run evals + export HTML report
  run-evals:
    name: Run Evalite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.4'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run evals & export report
        env:
          SKIP_AIMOCK: ${{ (github.event_name == 'schedule' || inputs.run_real_llm == true) && '1' || '' }}
        run: |
          pnpm exec evalite run
          pnpm exec evalite export --output eval-report
        working-directory: apps/agent

      - name: Run unit tests & generate HTML report
        run: pnpm run test --reporter=html
        working-directory: apps/agent

      - name: Merge test report into eval-report/tests
        run: cp -r apps/agent/test-report apps/agent/eval-report/tests

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: evalite-report-${{ github.sha }}
          path: apps/agent/eval-report/
          retention-days: 7
          if-no-files-found: error

  # 2. Deploy preview (every push)
  deploy-preview:
    name: Deploy Preview → Vercel
    needs: run-evals
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evalite-report-${{ github.sha }}
          path: apps/agent/eval-report

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Deploy to Vercel (preview)
        run: npx vercel deploy --token=$VERCEL_TOKEN
        working-directory: apps/agent/eval-report

  # 3. Deploy production (dev / main / scheduled)
  deploy-production:
    name: Deploy Production → Vercel
    needs: run-evals
    runs-on: ubuntu-latest
    if: >
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment:
      name: eval-report/production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evalite-report-${{ github.sha }}
          path: apps/agent/eval-report

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token=$VERCEL_TOKEN
        working-directory: apps/agent/eval-report
